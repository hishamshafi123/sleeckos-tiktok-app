services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # KVM8 defaults; KVM4 rollback: DB_CPU_LIMIT=0.5 DB_MEM_LIMIT=512m.
          memory: ${DB_MEM_LIMIT:-1g}
          cpus: "${DB_CPU_LIMIT:-1.0}"

  # Run one app/worker container on KVM8 (no replicas); Next.js and all queue
  # workers run together. Tune the concurrency variables below instead.
  app:
    build: .
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    shm_size: '256m'
    env_file: .env
    environment:
      # Constructed from the individual POSTGRES_* vars so password is set once.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Render pipeline bootstrap/default parallelism — tuned for KVM8.
      # Queue Dashboard performance modes override the primary render/Smart
      # Export limits live; these env values remain the fallback/boot defaults.
      # KVM4 rollback: RENDER_CONCURRENCY=2 FFMPEG_THREADS=2
      #   REMOTION_STILL_CONCURRENCY=2 TRANSCRIBE_CONCURRENCY=2
      #   EXPORT_WORKER_CONCURRENCY=4
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-4}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      REMOTION_STILL_CONCURRENCY: ${REMOTION_STILL_CONCURRENCY:-3}
      TRANSCRIBE_CONCURRENCY: ${TRANSCRIBE_CONCURRENCY:-2}
      EXPORT_WORKER_CONCURRENCY: ${EXPORT_WORKER_CONCURRENCY:-8}
    ports:
      # Bind to localhost only — nginx terminates TLS and proxies here.
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - uploads-data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # KVM8 defaults; override in .env for rollback or other host sizes.
          # KVM4 rollback: APP_CPU_LIMIT=3.5 APP_MEM_LIMIT=6g.
          # Render parallelism envs are documented above (environment: block).
          memory: ${APP_MEM_LIMIT:-12g}
          cpus: "${APP_CPU_LIMIT:-7.0}"

volumes:
  pgdata:
  uploads-data:
