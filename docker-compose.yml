services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  app:
    build: .
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    shm_size: '256m'
    env_file: .env
    environment:
      # Constructed from the individual POSTGRES_* vars so password is set once.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Render pipeline parallelism — tuned per box size (defaults are safe for
      # the current 4-vCPU box; raise after the KVM8 upgrade):
      #   KVM4 (now):   RENDER_CONCURRENCY=2 FFMPEG_THREADS=2 REMOTION_STILL_CONCURRENCY=2 TRANSCRIBE_CONCURRENCY=2
      #   KVM8 (target): RENDER_CONCURRENCY=4 FFMPEG_THREADS=2 REMOTION_STILL_CONCURRENCY=3 TRANSCRIBE_CONCURRENCY=2
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      REMOTION_STILL_CONCURRENCY: ${REMOTION_STILL_CONCURRENCY:-2}
      TRANSCRIBE_CONCURRENCY: ${TRANSCRIBE_CONCURRENCY:-2}
    ports:
      # Bind to localhost only — nginx terminates TLS and proxies here.
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - uploads-data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Sized for KVM8 (8 vCPU / 32GB): 4 render workers × 2 ffmpeg threads
          # (RENDER_CONCURRENCY / FFMPEG_THREADS) + 2-3 Remotion still lanes
          # (REMOTION_STILL_CONCURRENCY) + 2 Whisper lanes (TRANSCRIBE_CONCURRENCY),
          # with headroom for the web server. Caps don't reserve — on the current
          # 4-vCPU box the kernel simply shares fairly; set the envs down
          # (RENDER_CONCURRENCY=2 etc.) until the upgrade lands.
          memory: 14g
          cpus: "6.0"

volumes:
  pgdata:
  uploads-data:
